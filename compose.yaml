# Broker, storage, publisher and both consumers. The Python service set has
# been stable since stage 6; stages 7-9 changed queue arguments and consumer
# behaviour, not this file. InfluxDB arrived at stage 10, Grafana at stage 12.
#
# Expected steady state: rabbitmq Up (healthy), influxdb Up (healthy), and
# publisher, consumer-observe and consumer-store all Up. Only `topology` exits
# -- Exited (0), which is the one-shot declarer having done its job and is what
# the other three gate on.
#
# Every service is written out in full, with no YAML anchors. The four Python
# blocks differ only in `command`, so the repetition is deliberate: nothing is hidden,
# and a service that later needs its own environment or volumes just edits its
# own block. The cost is that `image`, `env_file`, `volumes` and RABBITMQ_HOST
# must be kept in sync by hand.

# Pinned rather than inherited from the directory name. From stage 3 this
# prefixes named volumes holding broker and database state, so a directory
# rename must not be able to change it.
name: thermo-warren

services:
  # ---------------------------------------------------------------- broker --
  rabbitmq:
    image: rabbitmq:4.3-management
    # RabbitMQ derives its node name from the hostname (rabbit@rabbitmq) and
    # stores data in a directory keyed by it. Left unset, Docker assigns a
    # random hostname per container and a recreated broker cannot find its own
    # data. Never change this value once a volume exists.
    hostname: rabbitmq
    environment:
      # Interpolated from .env by Compose itself. These apply ONLY on first
      # boot against an empty data directory -- editing them later has no
      # effect until the volume is destroyed.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      # AMQP and management stay on loopback. MQTT is published on all
      # interfaces from stage 17, because the ESP32 has to reach it from the
      # LAN -- there is no narrower binding that still works, since pinning
      # the host's own address only adds a machine-specific value that breaks
      # on a DHCP lease change without reducing who can connect.
      #
      # Note this exposes the `iot` user, which currently carries the
      # `administrator` tag. The answer to that is a scoped application user
      # (deferred hardening, see src/telemetry/CLAUDE.md), not a bind address.
      - "127.0.0.1:5672:5672"      # AMQP 0-9-1
      - "0.0.0.0:1883:1883"        # MQTT -- LAN-reachable for the ESP32
      - "127.0.0.1:15672:15672"    # management HTTP API and UI
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # Fails until every configured listener accepts a TCP connection, which
      # matters because the MQTT listener comes up after the node itself.
      # Liveness only: it opens a socket, with no handshake and no auth.
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # -------------------------------------------------------------- storage ---
  # Stage 10. consumer_store writes to it from stage 11; Grafana reads from
  # stage 12. Declared a stage before anything used it, deliberately, so that
  # stage 11 was a consumer change against a database already proven to work
  # rather than two new things failing at once -- which is what let the stage 11
  # failure test be about the outage and nothing else.
  influxdb:
    # Floating across patch releases, exactly like rabbitmq:4.3-management
    # above. 2.9 is also the first line that hashes tokens on disk, which is
    # the whole reason INFLUXDB_TOKEN below is ours to choose rather than
    # InfluxDB's to invent.
    image: influxdb:2.9
    environment:
      # Interpolated from .env by Compose itself, like the broker's credentials
      # above -- and with the same first-boot-only rule. The entrypoint runs
      # `influx setup` ONLY when /var/lib/influxdb2/influxd.bolt is absent; on
      # every later start it logs `found existing boltdb file, skipping setup
      # wrapper` and ignores every variable in this block. Editing them changes
      # nothing until the influxdb-data volume is destroyed.
      DOCKER_INFLUXDB_INIT_MODE: setup
      # The admin UI login. Never read by any Python module -- compose-only,
      # the same asymmetry RABBITMQ_VHOST carries.
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      # 0 is infinite. Stated explicitly although an unset variable produces
      # the same bucket -- the entrypoint passes --retention only when this is
      # non-empty, so leaving it out would be inheriting the default silently.
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION}
      # Generated by hand into .env before the first `up`. InfluxDB would
      # happily invent one, but from 2.9 it is hashed on disk and the plaintext
      # is unrecoverable afterwards -- there is no reading it back later.
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    ports:
      # Loopback only, unlike MQTT's 0.0.0.0. Nothing off this host talks to
      # InfluxDB: Grafana reaches it over the compose network at stage 12, and
      # this published port exists for host-mode runs and hand verification.
      - "127.0.0.1:8086:8086"
    volumes:
      # Two state directories, and both are named deliberately -- see the note
      # under `volumes:` at the foot of this file.
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      # /health needs no token (200 healthy, 503 unhealthy), so unlike a query
      # it cannot log an authentication failure every interval forever. curl is
      # already in the image; nothing is installed for this.
      #
      # Readiness, not liveness -- the opposite of rabbitmq's check above, and
      # deliberately so, because stage 11 gates consumer-store on this one.
      test: ["CMD", "curl", "-sf", "http://localhost:8086/health"]
      interval: 10s
      timeout: 10s
      retries: 12
      # First start is two-phase: the entrypoint boots a temporary influxd on
      # port 9999, runs `influx setup` against it, kills it, and only then
      # starts the real server. 8086 does not listen at all during that window,
      # so this covers a startup sequence rather than merely a slow boot.
      start_period: 30s
    restart: unless-stopped

  # --------------------------------------------------------------- Python ---
  # One-shot declarer. Runs to completion and exits; every other Python service
  # waits on that exit status, which is what makes the ordering enforced rather
  # than merely intended.
  topology:
    build:
      context: .
    image: thermo-warren:dev
    depends_on:
      rabbitmq:
        # Liveness, not readiness: check_port_connectivity opens a socket with
        # no handshake and no auth. topology.connect() retries to cover the gap.
        condition: service_healthy
    # Host-mode values, loaded wholesale...
    env_file: .env
    environment:
      # ...then the container-network override. This one line is the entire
      # difference between the two run modes.
      RABBITMQ_HOST: rabbitmq
    volumes:
      # Source is bind-mounted, so an edit needs no rebuild. Note the tradeoff:
      # a running container is then executing code that is not in the image.
      - ./src:/app/src
    restart: "no"
    command: ["python", "-m", "telemetry.topology"]

  publisher:
    build:
      context: .
    image: thermo-warren:dev
    depends_on:
      topology:
        # Nothing publishes or consumes until the topology exists. A topic
        # exchange with no matching binding discards silently, so this gate
        # replaces discipline with enforcement.
        condition: service_completed_successfully
    env_file: .env
    environment:
      RABBITMQ_HOST: rabbitmq
    volumes:
      - ./src:/app/src
    # Long-lived from stage 5 on, unlike topology above -- matches rabbitmq's
    # own policy. Restarts on crash (e.g. EXIT_UNREACHABLE while the broker is
    # still starting) and on daemon restart, but not after a deliberate
    # `docker compose stop publisher`.
    restart: unless-stopped
    command: ["python", "-m", "telemetry.publisher"]

  consumer-observe:
    build:
      context: .
    image: thermo-warren:dev
    depends_on:
      topology:
        # Nothing publishes or consumes until the topology exists. A topic
        # exchange with no matching binding discards silently, so this gate
        # replaces discipline with enforcement.
        condition: service_completed_successfully
    env_file: .env
    environment:
      RABBITMQ_HOST: rabbitmq
    volumes:
      - ./src:/app/src
    # Long-lived from stage 6, like publisher. The consumer reconnects to the
    # broker on its own (amqp.run_consumer), so this policy is for crashes and
    # daemon restarts, not for broker outages.
    restart: unless-stopped
    command: ["python", "-m", "telemetry.consumer_observe"]

  consumer-store:
    build:
      context: .
    image: thermo-warren:dev
    depends_on:
      topology:
        # Nothing publishes or consumes until the topology exists. A topic
        # exchange with no matching binding discards silently, so this gate
        # replaces discipline with enforcement.
        condition: service_completed_successfully
      influxdb:
        # Added at stage 11, when this became the only service that writes to
        # storage. service_healthy, not service_started, and that is why the
        # influxdb healthcheck above was written as readiness rather than
        # liveness: first start is two-phase and 8086 does not listen at all
        # while `influx setup` runs against the temporary server on 9999.
        #
        # Not fatal if it were missing -- the write retry and requeue would
        # cover the gap -- but every message published during the window would
        # take 3.5s of backoff first, for no reason.
        condition: service_healthy
    env_file: .env
    environment:
      RABBITMQ_HOST: rabbitmq
      # Same override shape as RABBITMQ_HOST: .env carries the host-mode value
      # (127.0.0.1:8086, the published port), and inside the compose network the
      # service name resolves instead. The container port is 8086 either way.
      INFLUXDB_URL: http://influxdb:8086
    volumes:
      - ./src:/app/src
    # Long-lived from stage 6, like publisher. --ack-delay is deliberately not
    # set here: it is a hand-run experiment, so it belongs on a command line,
    # not in the file that defines steady state.
    restart: unless-stopped
    command: ["python", "-m", "telemetry.consumer_store"]

volumes:
  # Broker state: definitions, queue contents, the node's identity. Prefixed
  # with the project name, hence pinning `name:` above. Destroying this volume
  # is how RABBITMQ_DEFAULT_USER/PASS get re-applied.
  rabbitmq-data:

  # InfluxDB keeps state in TWO places and the image declares both as volumes.
  #
  # Data: the bolt metadata file and the TSM engine. Whether influxd.bolt
  # exists in here is exactly what decides if the setup wrapper runs at all.
  influxdb-data:
  # Config: /etc/influxdb2/influx-configs, where the entrypoint writes the
  # CLI's host and admin token after setup. Named rather than left anonymous
  # -- without this, `docker compose down` drops the CLI's credentials into a
  # throwaway volume while the data survives, and in-container `influx`
  # commands then fail for no visible reason at all.
  #
  # The two belong together. Destroy influxdb-data alone and setup re-runs
  # underneath a config that already names an org; destroy influxdb-config
  # alone and setup is skipped while the CLI has no token. `down -v` takes
  # both, which is the only combination that is always coherent.
  influxdb-config:
