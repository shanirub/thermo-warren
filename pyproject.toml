[project]
name = "telemetry"
version = "0.1.0"
description = "ESP32-C3 -> RabbitMQ -> InfluxDB -> Grafana telemetry pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
]

# Broker, MQTT and storage clients are added at the stage that first needs them:
#   pika          -> stage 4 (topology declaration)
#   paho-mqtt     -> stage 5 (software publisher)
#   influxdb-client -> stage 11 (durable consumer writes)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry"]
