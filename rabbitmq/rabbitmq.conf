# RabbitMQ 4.x configuration (sysctl-style format).
#
# Unknown keys here abort startup with an error, unlike enabled_plugins, which
# is ignored silently when malformed. A node that refuses to boot after editing
# this file is telling you a key name is wrong.

# Disable anonymous logins broker-wide.
#
# In 4.x this replaced the per-protocol 3.13 keys mqtt.default_user and
# mqtt.default_password, which are no longer supported. Anonymous MQTT
# connections would otherwise fall back to the guest account.
#
# Deliberately NOT also setting mqtt.allow_anonymous: the docs are ambiguous
# about whether it survives in 4.3, and an unsupported key here stops the node
# from booting. Prove the behaviour by attempting an anonymous connection
# instead of stacking settings that might conflict.
anonymous_login_user = none
